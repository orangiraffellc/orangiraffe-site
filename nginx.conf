# Served by the orangiraffe-web container. TLS, compression and security
# headers are handled by the shared Caddy in front of it.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;
    absolute_redirect off;

    # Clean URLs: /privacy serves privacy.html (pages set a canonical link).
    location / { try_files $uri $uri.html $uri/ =404; }

    location /assets/ { expires 7d; }

    # Contact form handler (the `form` service on this project's own network).
    # Resolved per request, so nginx still starts if the form container is down.
    location = /api/contact {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $form_upstream http://form:8000;
        proxy_pass $form_upstream;
        # Caddy sets X-Forwarded-For to the real client address.
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Private inbox, served (and password-checked) by the `form` service.
    location = /inbox {
        client_max_body_size 256k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $form_upstream http://form:8000;
        proxy_pass $form_upstream;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
